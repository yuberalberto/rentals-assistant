[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rentals-assistant"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27.2",
    "playwright>=1.45.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.2",
    "python-telegram-bot>=21.4.0",
    "APScheduler>=3.10.4",
    "pydantic-settings>=2.4.0",
    "curl-cffi>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: live network tests requiring real credentials (skip with -m 'not integration')",
]

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
target-version = "py314"

[tool.ruff.isort]
known-first-party = ["rentals_assistant"]

[tool.hatch.build.targets.wheel]
packages = ["rentals_assistant"]
